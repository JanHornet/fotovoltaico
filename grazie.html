<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Richiesta inviata - Green Energy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f8;
    color: #173042;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.box {
    max-width: 600px;
    width: 100%;
    background: white;
    padding: 45px 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    text-align: center;
}

h1 {
    margin-top: 0;
    font-size: 32px;
    color: #173042;
}

p {
    color: #68777e;
    font-size: 18px;
    line-height: 1.6;
}

a {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 24px;
    background: #eab52b;
    color: #173042;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

a:hover {
    background: #dca91f;
}
</style>

</head>

<body>

<div class="box">

    <h1>Richiesta inviata!</h1>

    <p>
        Grazie per averci contattato.<br>
        Abbiamo ricevuto la tua richiesta e ti ricontatteremo al più presto.
    </p>

        Torna alla pagina principale
    </a>

</div>
